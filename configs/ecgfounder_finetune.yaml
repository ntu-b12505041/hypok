project:
  name: "ECGFounder Fine-tuning Dyskalemia Control"
  seed: 20260723
  output_dir: "outputs/ecgfounder_finetune"

# This config intentionally points to the exact same cohort and split CSV as
# configs/mimic.yaml. Do not generate a new split for the comparison model.
data:
  cohort_source: "precomputed"
  precomputed_cohort_csv: "data/raw/hyperkalemia_data.csv"
  precomputed_ecg_time_tolerance_seconds: 1
  # Read every selected waveform once and reject any NaN/Inf before splitting.
  precomputed_validate_signal_values: true
  precomputed_matching_assumption:
    serum_itemid: 50971
    lab_window_minutes: 60
    select_nearest: true
    tie_prefer_before_ecg: true
  ecg_root: "/path/to/mimic-iv-ecg/1.0"
  # Not read while cohort_source=precomputed; retained for optional raw reproduction.
  clinical_root: "/path/to/mimiciv/3.1"
  ecg_index_csv: "data/interim/ecg_index.csv"
  cohort_csv: "data/processed/precomputed_ecg_potassium_cohort.csv"
  split_csv: "data/processed/precomputed_ecg_potassium_cohort_split.csv"
  waveform_cache_dir: null
  mimic_ecg_version: "1.0"
  mimic_clinical_version: "3.1"
  lab_window_minutes: 60
  include_whole_blood: false
  potassium_itemids:
    serum: [50971]
    whole_blood: [50822, 52452]
  min_potassium: 1.5
  max_potassium: 10.0
  prefer_lab_before_ecg: true
  require_12_leads: true
  lead_order: ["I", "II", "III", "aVR", "aVL", "aVF", "V1", "V2", "V3", "V4", "V5", "V6"]

labels:
  hypokalemia_upper: 3.5
  hyperkalemia_lower: 5.5
  hypokalemia_inclusive: false
  hyperkalemia_inclusive: true
  names: ["HypoK", "NK", "HyperK"]

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  group_column: "subject_id"
  label_column: "label_id"

# ECGFounder was pretrained on 12 x 5000 input. Its official implementation
# applies band-pass filtering and one global z-score across the ECG.
preprocess:
  target_sampling_rate: 500
  duration_seconds: 10
  bandpass_low_hz: 0.67
  bandpass_high_hz: 40.0
  notch_hz: 50.0
  notch_quality_factor: 30.0
  clip_millivolts: null
  remove_baseline: true
  apply_notch: true
  normalization: "global_zscore"
  profile: "ecgfounder_official"

augmentation:
  enabled: true
  # Noise is disabled because this dataset class normalizes before augmentation.
  gaussian_noise_std_millivolts: 0.0
  max_time_shift_seconds: 0.08
  lead_dropout_probability: 0.03
  amplitude_scale_range: [1.0, 1.0]

sampling:
  # Identical train-only sampler to the from-scratch baseline.
  enabled: true
  strategy: "rotating_nk_subsampling"
  majority_class_id: 1
  majority_to_minority_total_ratio: 1.5
  rotate_each_epoch: true
  seed: 20260723

model:
  name: "ecgfounder_multitask"
  checkpoint_path: "checkpoints/ecgfounder/12_lead_ECGFounder.pth"
  # Fill this after download for immutable research runs.
  checkpoint_sha256: null
  dropout: 0.20
  num_classes: 3
  potassium_center: 4.3
  potassium_scale: 1.0
  pretrained_checkpoint: null
  # Train new heads first, then unfreeze the complete backbone.
  freeze_backbone_epochs: 5
  backbone_learning_rate: 0.0001
  head_learning_rate: 0.001

training:
  device: "auto"
  epochs: 40
  batch_size: 16
  num_workers: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 2
  mixed_precision: true
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  monitor: "val_macro_auroc"
  class_weight_method: "effective_number"
  effective_number_beta: 0.9999
  label_smoothing: 0.02
  loss_weights:
    classification: 1.0
    ordinal: 0.30
    regression: 0.20

calibration:
  temperature_scaling: true
  threshold_grid_size: 151
  target_recall: 0.85
  target_specificity: 0.85
  selection_metric: "minimum_recall_specificity"

evaluation:
  bootstrap_iterations: 2000
  bootstrap_confidence_level: 0.95
  bootstrap_unit: "subject_id"
  save_predictions: true
  decision_curve: false
